<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZECOLE VR 런처</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#0e0e11; --bg-2:#131317; --surface:#18181d; --surface-2:#1f1f25; --surface-3:#26262d;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --text:#eeebe4; --text-2:#bdb9b0; --muted:#8a867d; --faint:#5f5c56;
  --accent:#e6a96e; --accent-hi:#f3c896; --accent-ink:#2a1b0d; --accent-soft:rgba(230,169,110,.12);
  --blue:#6fa8ff; --blue-soft:rgba(111,168,255,.12);
  --ok:#6cc08a; --ok-soft:rgba(108,192,138,.12); --err:#e8667a; --yt:#ff4e45;
  --r-sm:8px; --r:12px; --r-lg:16px;
  --shadow:0 20px 60px rgba(0,0,0,.45); --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard",-apple-system,"Malgun Gothic",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"tnum" 1;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#2b2b32;border-radius:10px;border:3px solid transparent;background-clip:padding-box}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 브라우저 미리보기에서만 창처럼 띄움. 런처 안에서는 창 전체를 채움 */
body.preview{display:grid;place-items:center;background:#08080a radial-gradient(ellipse at 30% 20%,#1a1712 0,transparent 60%)}
.app{width:100vw;height:100vh;display:grid;grid-template-rows:40px 1fr;background:var(--bg);overflow:hidden}
body.preview .app{width:min(1460px,100vw);height:min(820px,100vh);border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.09),0 30px 90px rgba(0,0,0,.6)}

/* ── 제목 줄 ── */
.titlebar{display:flex;align-items:center;gap:10px;padding-left:16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;pointer-events:none}
.mark{width:22px;height:22px;border-radius:6px;background:url(icon.png) center/cover}
.brand b{font-weight:800;letter-spacing:.14em;font-size:12px}
.brand span{color:var(--muted);font-size:12px}
.tb-sp{flex:1;align-self:stretch}
.tb-meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;white-space:nowrap}
.tb-pill{display:flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(230,169,110,.3)}
.tb-pill:hover{background:rgba(230,169,110,.2)}
.winbtns{display:flex;height:100%;margin-left:6px}
.winbtns button{width:46px;height:100%;display:grid;place-items:center;color:var(--text-2)}
.winbtns button:hover{background:var(--surface-2)} .winbtns button.x:hover{background:#c42b1c;color:#fff}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.dot.warn{background:var(--accent)} .dot.off{background:var(--faint)} .dot.err{background:var(--err)} .dot.blue{background:var(--blue)}
.pulse{animation:pulse 1s ease-in-out infinite alternate}@keyframes pulse{from{opacity:.35}to{opacity:1}}

.body{display:grid;grid-template-columns:240px minmax(0,1fr) 280px;min-height:0}
/* ── 오른쪽 칸: 혜택 · 링크 ── */
.rail{background:var(--bg-2);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.rail-scroll{flex:1;overflow:auto;padding:14px 12px 10px}
.rail-h{margin:2px 4px 8px;font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.rail-h.gap{margin-top:16px}
.rlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;margin-bottom:6px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.rlink:hover{background:var(--surface-2)}
.rlink .ic{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center}
.rlink b{display:block;font-size:13px;line-height:1.35}
.rlink small{display:block;font-size:11.5px;line-height:1.4;color:var(--muted)}
.rlink .arr{margin-left:auto;color:var(--faint);flex:none}
.rail-foot{border-top:1px solid var(--line);padding:9px 12px;text-align:center}

/* ── 사이드바 ── */
.side{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.side-scroll{flex:1;overflow:auto;padding:12px 10px}
.nav{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r-sm);color:var(--text-2);width:100%;text-align:left;font-weight:600}
.nav:hover{background:var(--surface);color:var(--text)} .nav.on{background:var(--surface-2);color:var(--text)}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:9px;padding:0 6px;line-height:18px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:16px 10px 6px;font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sec em{font-style:normal;color:var(--faint)}
.sec .sl{display:flex;align-items:center;gap:6px;color:var(--sc,var(--muted))}
.sec .sl svg{flex:none}
.sec .sl span{color:var(--muted)}
.gitem{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border-radius:var(--r-sm);text-align:left}
.gitem:hover{background:var(--surface)} .gitem.on{background:var(--surface-2)}
.gitem.hint{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(230,169,110,.35)} .gitem .hint-b{flex:none;margin-left:auto}
.gitem.on::before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.thumb{position:relative;overflow:hidden;width:38px;height:38px;border-radius:8px;flex:none;background-color:var(--surface-3);background-position:center;background-size:cover;box-shadow:inset 0 0 0 1px var(--line)}
.gmeta{min-width:0;flex:1}
.gname{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.gsub .warn-t{color:var(--accent)}
.badge{font-size:9.5px;font-weight:800;color:var(--accent-ink);background:var(--accent);padding:0 4px;border-radius:3px;letter-spacing:.04em;line-height:15px}
.badge.blue{background:var(--blue);color:#0b1830}
.req{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:9px 10px;border-radius:var(--r-sm);border:1px dashed var(--line-2);color:var(--muted);font-size:12.5px}
.req:hover{color:var(--text);border-color:var(--accent)}
.skel{height:50px;margin:2px 0;border-radius:8px;background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

.side-promo{display:block;width:100%;text-align:left;padding:11px 12px 10px;border-radius:10px;margin-bottom:8px;background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 16%,transparent),color-mix(in srgb,var(--pc) 4%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 28%,transparent)}
.side-promo:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 60%,transparent)}
.side-promo small{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--pc)}
.side-promo small svg{flex:none}
.side-promo b{display:block;font-size:13px;line-height:1.4;margin-top:3px}
.deals{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.deal{border-radius:8px;padding:7px 9px 8px;background:color-mix(in srgb,var(--pc) 11%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 26%,transparent)}
.deal b{display:flex;align-items:baseline;gap:3px;font-size:22px;font-weight:900;line-height:1.1;letter-spacing:-.02em;color:var(--pc)}
.deal b small{font-size:11px;font-weight:800;letter-spacing:0}
.deal span{display:block;margin-top:2px;font-size:11px;line-height:1.35;color:var(--text-2)}
.deal em{display:block;font-style:normal;font-size:10.5px;color:var(--muted)}
.deal.hot{background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 24%,transparent),color-mix(in srgb,var(--pc) 8%,transparent));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 50%,transparent)}
.cline{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:8px;border-top:1px dashed color-mix(in srgb,var(--pc) 30%,transparent);font-size:11.5px;line-height:1.45;color:var(--text-2)}
.cline svg{flex:none;color:var(--pc)}
.pts{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px}
.pts li{position:relative;padding-left:13px;font-size:11.5px;line-height:1.45;color:var(--text-2)}
.pts li::before{content:"";position:absolute;left:2px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--pc)}
.pcode{display:inline-block;font-weight:800;letter-spacing:.06em;color:var(--pc);background:color-mix(in srgb,var(--pc) 18%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--pc) 45%,transparent);padding:0 6px;border-radius:4px;cursor:copy}
.pcode:hover{background:color-mix(in srgb,var(--pc) 30%,transparent)}

/* ── 본문 ── */
.main{overflow:auto;min-height:0;position:relative;user-select:text}
.page{padding:22px 26px 32px}
.enter{animation:fade .25s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11.5px;letter-spacing:.12em;color:var(--muted);font-weight:700}
h1{font-size:25px;letter-spacing:-.02em;margin:4px 0 2px;font-weight:800}
h1.h1-lead{font-size:24px;line-height:1.3;margin:4px 0 3px}
.lede{color:var(--text-2);margin:0}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:16px}
.seg{display:flex;background:var(--surface);border-radius:10px;padding:3px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{height:28px;padding:0 11px;border-radius:7px;font-size:12.5px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--surface-3);color:var(--text)}
.variant-seg{display:inline-flex;margin:0 0 12px}
.variant-seg button{height:32px;padding:0 16px;font-size:13px}

.promo-ic{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:900}

.alert{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 16px;border-radius:var(--r);background:linear-gradient(90deg,rgba(230,169,110,.14),rgba(230,169,110,.04));box-shadow:inset 0 0 0 1px rgba(230,169,110,.22);margin-bottom:14px}
.alert.hint-card .thumb{flex:none;width:40px;height:40px;border-radius:8px;background-size:cover;background-position:center;display:grid;place-items:center}
.alert.blue{background:linear-gradient(90deg,rgba(111,168,255,.13),rgba(111,168,255,.03));box-shadow:inset 0 0 0 1px rgba(111,168,255,.22)}
.alert p{margin:0;flex:1;color:var(--text-2)} .alert b{color:var(--text)}
.alert .x{color:var(--faint);width:24px;height:24px;display:grid;place-items:center;border-radius:6px}.alert .x:hover{color:var(--text);background:var(--surface-2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{position:relative;border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s;text-align:left}
.card:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px var(--line-2),var(--shadow)}
.cover{aspect-ratio:16/8;background-color:var(--surface-3);background-position:center;background-size:cover;position:relative}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(24,24,29,.96))}
.plat{position:absolute;top:10px;left:10px;right:10px;z-index:1;display:flex;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(10,10,12,.66);backdrop-filter:blur(8px);color:var(--text-2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);white-space:nowrap}
.tag.acc{color:var(--accent-ink);background:var(--accent);box-shadow:none} .tag.blue{color:#0b1830;background:var(--blue);box-shadow:none} .tag.ok{color:var(--ok)}
.card-body{padding:2px 14px 14px;margin-top:-24px;position:relative;z-index:1}
.card h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);min-width:0;white-space:nowrap;overflow:hidden}
.mini{height:30px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:700;background:var(--surface-3);color:var(--text);flex:none}
.mini:hover{background:#30303a}
.mini.acc{background:var(--accent);color:var(--accent-ink)} .mini.acc:hover{background:var(--accent-hi)}
.mini.blue{background:var(--blue);color:#0b1830}
.card.ghost{display:grid;place-items:center;text-align:center;min-height:230px;background:transparent;border:1px dashed var(--line-2);box-shadow:none;color:var(--muted)}
.card.ghost:hover{color:var(--text);border-color:var(--accent)}
.plus{width:42px;height:42px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2)}
.glyph{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;letter-spacing:-.04em;color:rgba(230,220,255,.85);z-index:0}
.glyph-s{font-size:11px}.glyph-l{font-size:44px;opacity:.5}.glyph-xl{font-size:120px;opacity:.18;justify-items:end;padding-right:60px}
.empty{grid-column:1/-1;padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r-lg)}

.sub-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sub-h h2{margin:0;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.sub-h span{font-size:12.5px;color:var(--muted)}
.sub-h .link{margin-left:auto}
.panel{border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:16px}
.panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-h h2{margin:0;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.link{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.link:hover{color:var(--accent)}
.channel{margin:0 0 18px}
.vids{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.vid{cursor:pointer;text-align:left}
/* ── zecole.store 신규출시 카드 ── */
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sgame{display:flex;flex-direction:column;text-align:left;border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.sgame:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.sgame .sthumb{aspect-ratio:16/9;background:var(--surface-3) center/cover;position:relative}
.sgame .sthumb .off{position:absolute;left:8px;top:8px;height:20px;padding:0 6px;border-radius:5px;display:flex;align-items:center;font-size:11px;font-weight:800;background:var(--accent);color:var(--accent-ink)}
.sgame .sbody{padding:9px 11px 11px;display:flex;flex-direction:column;gap:3px;flex:1}
.sgame .sname{font-size:13px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.sgame .smeta{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.sgame .sprice{margin-top:auto;padding-top:4px;display:flex;align-items:baseline;gap:6px;font-family:"Pretendard","Malgun Gothic",sans-serif}
.sgame .sprice b{font-size:13.5px;font-weight:800}
.sgame .sprice s{font-size:11.5px;color:var(--faint)}
.sgame .sprice .free{color:var(--ok)}
.vthumb{aspect-ratio:16/9;border-radius:9px;background:var(--surface-3) center/cover;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.vplay{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .2s;background:rgba(0,0,0,.25)}
.vid:hover .vplay{opacity:1}
.vt{font-size:12.5px;font-weight:600;line-height:1.4;margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vg{font-size:11.5px;color:var(--muted);margin-top:2px}
.stack{display:grid;gap:12px;align-content:start}
.promo{display:flex;gap:13px;align-items:center;cursor:pointer;text-align:left;width:100%}
.promo:hover{background:var(--surface-2)}
.promo .pic{width:42px;height:42px;border-radius:11px;flex:none;display:grid;place-items:center;background-size:cover;background-position:center}
.promo h3{margin:0 0 1px;font-size:14px;font-weight:800}
.promo p{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
.promo .arr{margin-left:auto;color:var(--faint)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

/* ── 상세 ── */
.hero{position:relative;height:240px;background-color:#111;background-position:center 30%;background-size:cover;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,14,17,.1) 0%,rgba(14,14,17,.35) 45%,var(--bg) 100%),linear-gradient(90deg,rgba(14,14,17,.75),transparent 60%)}
.hero-in{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 26px 16px}
.crumb{position:absolute;top:14px;left:26px;z-index:2;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);height:30px;padding:0 12px 0 8px;border-radius:8px;background:rgba(10,10,12,.5);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.crumb:hover{color:var(--text)}
.hero h1{font-size:32px;margin:8px 0 0;letter-spacing:-.025em;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.dpage{padding:0 26px 30px}
.actionbar{display:flex;align-items:stretch;gap:10px;margin-top:4px}
.primary{position:relative;flex:0 0 320px;height:54px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:10px;overflow:hidden;transition:background .15s,transform .1s;box-shadow:0 10px 30px rgba(230,169,110,.18)}
.primary:hover:not(:disabled){background:var(--accent-hi)} .primary:active:not(:disabled){transform:scale(.99)}
.primary.soft{background:#eeebe4;box-shadow:0 10px 30px rgba(255,255,255,.06)} .primary.soft:hover:not(:disabled){background:#fff}
.primary:disabled:not(.busy){background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.sec-btn:disabled{opacity:.45}
.primary.busy{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.primary .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(230,169,110,.2);transition:width .25s linear}
.primary .bar::after{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--accent)}
.primary span,.primary svg{position:relative}
.primary small{font-weight:600;opacity:.65;font-size:12.5px}
.sec-btn{height:54px;padding:0 16px;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:8px;font-weight:650;color:var(--text-2);white-space:nowrap}
.sec-btn:hover{background:var(--surface-2);color:var(--text)}

"use strict";
/* ══════════════════════════════════════════════════════════════
   런처 연결 (C# ↔ JS). 브라우저 미리보기에서는 mock 으로 동작
   ══════════════════════════════════════════════════════════════ */
const IN_APP = !!(window.chrome && window.chrome.webview);

let _seq = 0; const _wait = new Map(); const _listeners = {};
if (IN_APP) {
  window.chrome.webview.addEventListener("message", e => {
    const m = e.data;
    if (m && m.event) return (_listeners[m.event] || []).forEach(f => f(m.data));
    const w = _wait.get(m.id); if (!w) return; _wait.delete(m.id);
    m.ok ? w.res(m.result) : w.rej(new Error(m.error || "오류"));
  });
}
function host(cmd, args = {}) {
  if (!IN_APP) return Mock[cmd] ? Mock[cmd](args) : Promise.resolve(null);
  const id = ++_seq;
  return new Promise((res, rej) => { _wait.set(id, { res, rej }); window.chrome.webview.postMessage({ id, cmd, args }); });
}
const on = (evt, f) => (_listeners[evt] = _listeners[evt] || []).push(f);
const emit = (evt, d) => (_listeners[evt] || []).forEach(f => f(d));

const Mock = {
  "app.info": async () => ({ version: "1.0.1", startHint: new URLSearchParams(location.search).get("game"), exeName: "ZECOLE_Launcher.exe" }),
  "net.get": async ({ url }) => { try { const r = await fetch(url); return { status: r.status, body: r.ok ? await r.text() : null }; } catch { return { status: 0, body: null }; } },
  "youtube.feed": async () => [],
  "steam.apps": async () => ({ "2609610": { name: "CONVRGENCE", path: "D:\\SteamLibrary\\steamapps\\common\\CONVRGENCE" }, "559330": { name: "A Fisherman's Tale", path: "C:\\Program Files (x86)\\Steam\\steamapps\\common\\A Fisherman's Tale" } }),
  "status.scan": async () => ({ convrgence: { usedBefore: true, installedVersion: "1.5.1" }, h3vr2: { usedBefore: true, lastRun: { tag: "v0.4.0" } } }),
  "install.start": ({ id }) => new Promise(res => {
    let d = 0; const total = 50e6;
    const t = setInterval(() => {
      d = Math.min(total, d + 2.5e6); emit("install-progress", { id, phase: "download", done: d, total, secs: d / 8e6 });
      if (d >= total) { clearInterval(t); emit("install-progress", { id, phase: "verify" });
        setTimeout(() => { emit("install-progress", { id, phase: "running" }); setTimeout(() => { emit("install-progress", { id, phase: "done" }); res({ exitCode: 0 }); }, 1600); }, 500); }
    }, 90);
  }),
  "open.url": async ({ url }) => toast("브라우저에서 엽니다 · " + url.replace(/^https?:\/\//, "")),
};

/* ══════════════════════════════════════════════════════════════
   상태
   ══════════════════════════════════════════════════════════════ */
let C = null;                 // 설정 (catalog.json ← feed.json)
let ITEMS = [];               // 게임/모드 목록
let SUBS = [];                // 목록에 따로 보이지 않는 하위 판 (예: A Fisherman's Tale Quest판)
const byId = id => ITEMS.find(x => x.id === id) || SUBS.find(x => x.id === id);
const setItems = list => { ITEMS = list; SUBS = list.flatMap(i => i.subs || []); };
let STORE_NEW = null;          // zecole.store 신규출시 게임 (null = 아직 모름/실패)
let VIDEOS = [];              // 유튜브 최신 영상
let STEAM = {};               // 이 PC 의 Steam 게임
const S = { q: {}, qprog: {}, qbusy: null, view: "home", filter: store("filter") || "all", busy: null, sync: "checking", syncedAt: null, info: {}, hint: null, update: null, hintDone: false };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem("zl." + k)); localStorage.setItem("zl." + k, JSON.stringify(v)); } catch { return null; } }
const cleanV = t => String(t || "").replace(/^v\.?/i, "").trim();
const cmpV = (a, b) => { const pa = cleanV(a).split(/[.\-]/), pb = cleanV(b).split(/[.\-]/); for (let i = 0; i < Math.max(pa.length, pb.length); i++) { const x = pa[i] ?? "", y = pb[i] ?? ""; const nx = /^\d+$/.test(x), ny = /^\d+$/.test(y); if (nx && ny) { if (+x !== +y) return +x - +y; } else if (x !== y) { if (!x) return 1; if (!y) return -1; return x < y ? -1 : 1; } } return 0; };
const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9가-힣]/g, "");
const daysAgo = d => d ? (Date.now() - new Date(d)) / 864e5 : 999;
const fmtDate = d => d ? d.slice(0, 10) : "";
const MB = n => (n / 1048576).toFixed(n > 1048576 * 100 ? 0 : 1) + "MB";

const ICON = {

  heart: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3 5 6.4 5c2 0 3.3 1 5.6 3.3C14.3 6 15.6 5 17.6 5 21 5 23 8.4 21.6 11.7 19.5 16.4 12 21 12 21z"/></svg>',
  globe: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>',

};

/* ══════════════════════════════════════════════════════════════
   카탈로그: 기본값(catalog.json) + 원격 운영 파일(feed.json) + GitHub 저장소
   새 저장소에 릴리스만 올리면 자동으로 목록에 추가됨.
   저장소에 zecole.json 을 두면 이름·플랫폼·설치 방식 등을 직접 지정.
   ══════════════════════════════════════════════════════════════ */
async function getJson(url, maxAgeSec = 0) {
  try {
    const r = await host("net.get", { url, maxAgeSec });
    if (!r || r.status !== 200 || !r.body) return { data: null, status: r?.status ?? 0, stale: r?.stale };
    return { data: JSON.parse(r.body), status: 200, stale: !!r.stale };
  } catch { return { data: null, status: 0 }; }
}
const deepMerge = (a, b) => { if (!b) return a; const o = Array.isArray(a) ? [...a] : { ...a }; for (const k in b) o[k] = (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && a && typeof a[k] === "object" && !Array.isArray(a[k])) ? deepMerge(a[k], b[k]) : b[k]; return o; };

function deriveFromRepo(repo) {
  const n = repo.name, d = repo.description || "";
  const text = n + " " + d;
  const kind = /korean|한국어|한글/i.test(text) ? "patch" : /mod\b|모드/i.test(text) ? "mod" : "tool";
  const platforms = [];
  if (/pc\s?vr|steam/i.test(text)) platforms.push("pcvr");
  if (/quest|퀘스트/i.test(text)) platforms.push("quest");
  const name = n.replace(/[-_]?(korean[-_]?patch|koreanpatch)/i, "").replace(/[-_]?quest$/i, "").replace(/[-_]+/g, " ").trim() || n;
  return { id: norm(n).slice(0, 24), kind, name, sub: d.split("|")[0].replace(/·?\s*제작.*$/, "").trim().slice(0, 60), platforms: platforms.length ? platforms : ["pcvr"], install: {} };
}

function pickAsset(item, release) {
  const assets = release.assets || [];
  const mode = item.install?.mode;
  if (mode === "page") return null;
  const re = item.install?.asset ? new RegExp(item.install.asset, "i") : null;
  const bad = /diagnostic|debug|symbols|\.sha256$|sha256sums|readme|license|\.txt$|\.md$/i;
  // 이름 규칙에 맞는 첨부가 여럿이면(전환 기간: 설치기 EXE + 데이터 zpkg) 첨부 순서와 상관없이 zpkg를 먼저 고름
  const hits = re ? assets.filter(x => re.test(x.name)) : [];
  let a = hits.find(x => /\.zpkg$/i.test(x.name)) || hits[0] || null;
  if (!a && !re && mode !== "engine") a = assets.find(x => /\.exe$/i.test(x.name) && !bad.test(x.name));
  if (!a && mode === "zip") a = assets.find(x => /\.zip$/i.test(x.name) && !bad.test(x.name));
  if (!a) return null;
  return { name: a.name, url: a.browser_download_url, size: a.size, digest: a.digest || null, mode: mode === "engine" ? "engine" : /\.zip$/i.test(a.name) ? "zip" : "exe" };
}

function bullets(body) {
  return (body || "").split(/\r?\n/).filter(l => /^\s*[-*] /.test(l))
    .map(l => l.replace(/^\s*[-*] /, "").replace(/\*\*|`/g, "").replace(/\[(.*?)\]\(.*?\)/g, "$1").trim())
    .filter(l => l.length > 3 && l.length < 120 && !/source code|sha-?256|다운로드/i.test(l)).slice(0, 3);

const SAFE_ID = /^[a-z0-9][a-z0-9-]{0,40}$/, SAFE_KEY = /^[A-Za-z0-9_][A-Za-z0-9_.-]{0,80}$/;

  it.releaseUrl = it.releaseUrl || it.repoUrl + "/releases/latest";
  it.mode = it.install?.mode === "page" ? "page" : (it.asset?.mode || (it.asset ? "exe" : "page"));

  if (Array.isArray(it.variants) && !it.parentId) {

    it.subs = it.variants.filter(v => v && SAFE_ID.test(v.id || "") && v.id !== it.id)
      .map(v => finishItem({ ...base, ...v, parentId: it.id, pkgKey: SAFE_KEY.test(v.pkgKey || "") && v.pkgKey !== it.repo ? v.pkgKey : it.repo + "." + v.id }, releases));

}

async function loadCatalog() {
  const base = await (await fetch("catalog.json", { cache: "no-store" })).json();
  C = base;
  // 1) 원격 운영 파일: 홍보 문구·링크·공지·게임 정보 덮어쓰기 (런처 재배포 없이 수정)
  for (const u of base.feedUrls || []) {
    const r = await getJson(u, 900);
    if (r.data) { C = deepMerge(C, r.data); break; }
  }
  // 오프라인이어도 바로 보이게 기본값으로 먼저 그림
  if (!ITEMS.length) { setItems(Object.entries(C.items).map(([repo, m]) => finishItem({ repo, ...m }, null))); sortItems(); render(); }

  // 2) GitHub 저장소 목록 → 릴리스가 있는 저장소는 자동 등록
  const list = await getJson(`https://api.github.com/users/${C.github}/repos?per_page=100&sort=pushed`, 600);
  const hidden = new Set((C.hiddenRepos || []).map(s => s.toLowerCase()));
  let repos = (list.data || []).filter(r => !r.fork && !r.archived && !r.private && !hidden.has(r.name.toLowerCase()));
  if (!repos.length) repos = Object.keys(C.items).map(name => ({ name, description: "" }));

  const built = await Promise.all(repos.map(async repo => {
    const [man, rels] = await Promise.all([
      getJson(`https://raw.githubusercontent.com/${C.github}/${repo.name}/HEAD/zecole.json`, 3600),
      getJson(`https://api.github.com/repos/${C.github}/${repo.name}/releases?per_page=5`, 300),
    ]);
    const item = deepMerge(deepMerge(deriveFromRepo(repo), C.items[repo.name] || {}), man.data || {});
    if (item.hidden) return null;
    const rel = Array.isArray(rels.data) ? rels.data : null;
    if (!rel && !C.items[repo.name] && !man.data) return null;            // 릴리스 없는 새 저장소는 아직 숨김
    if (rel && !rel.some(r => !r.prerelease) && !man.data?.comingSoon) return null;
    return finishItem({ repo: repo.name, ...item, isNewRepo: !C.items[repo.name] }, rel);
  }));
  setItems(built.filter(Boolean));
  sortItems();
  { const cur = byId(S.view); if (cur && cur.mode === "engine" && !S.qbusy && (!S.q[cur.id] || S.q[cur.id].checking)) engineCheck(cur)(cur.id); }
  S.sync = list.data ? (list.stale ? "stale" : "ok") : "offline";
  S.syncedAt = Date.now();
}
function sortItems() {
  const k = { patch: 0, mod: 1, tool: 2 };
  ITEMS.sort((a, b) => (k[a.kind] ?? 3) - (k[b.kind] ?? 3) || (b.date || "").localeCompare(a.date || "") || (a.order ?? 999) - (b.order ?? 999));
}

async function refreshStatus() {
  try {
    const all = [...ITEMS, ...SUBS];
    const res = await host("status.scan", { items: all.map(i => ({ id: i.id, repo: i.repo, stateDir: i.stateDir || null, detect: i.detect || null })) });
    all.forEach(i => { i.status = res?.[i.id] || {}; if (i.parentId) i.status = { ...i.status, lastRun: null }; });
  } catch { }
}

/* ══════════════════════════════════════════════════════════════
   상태 판단

const isPatch = g => g.kind === "patch";
const platLabel = g => g.platforms.includes("pcvr") && g.platforms.includes("quest") ? "PC VR · Quest" : g.platforms.includes("quest") ? (isPatch(g) ? "Quest 단독" : "Quest") : "PC VR";
const isQuest = g => g.platforms.includes("quest");
// Steam 감지는 PC VR 패치에만 의미 있음 (Quest 단독 패치는 Steam판에 적용 안 됨)
const steamOf = g => g.platforms.includes("pcvr") && g.steamAppId && STEAM[g.steamAppId];
const isNewRelease = g => daysAgo(g.date) <= 10;
function seenNew(g) { const seen = store("seen") || []; return g.isNewRepo && !seen.includes(g.repo); }

function stat(g) {
  if (!g.subs?.length) return statOne(g);
  const all = [statOne(g), ...g.subs.map(statOne)], rank = { update: 0, ok: 1, ran: 2 };
  return all.filter(x => x.key in rank).sort((a, b) => rank[a.key] - rank[b.key])[0] || all[0];
}

  const L = g.latest;
  const what = isPatch(g) ? "한글패치" : g.kind === "mod" ? "모드" : "앱";
  if (inst) {
    if (L && cmpV(inst, L) < 0) return { key: "update", label: "업데이트 있음", dot: "warn", inst, what };
    return { key: "ok", label: "최신 버전", dot: "", inst, what };
  }
  if (ran) {
    if (L && cmpV(ran, L) < 0) return { key: "update", label: "업데이트 있음", dot: "warn", inst: ran, what, guess: true };
    return { key: "ran", label: "설치기 실행함", dot: "", inst: ran, what, guess: true };
  }
  if (st.usedBefore) return { key: "used", label: "이 PC에서 사용 기록", dot: "blue", what };

}
function primaryLabel(g, s) {

  if (s.key === "update") return { text: `${s.what} 업데이트`, ver: g.latest, icon: ICON.down };
  if (s.key === "ok" || s.key === "ran") return { text: "설치기 다시 열기", ver: g.latest, icon: ICON.down, cls: "soft" };
  if (s.key === "used") return { text: "최신 설치기 받기", ver: g.latest, icon: ICON.down };
  return { text: `${s.what} 설치`, ver: g.latest, icon: ICON.down };
}

  return steamOf(g) ? g.id : g.subs[0].id;
}

/* 설치 진행 중: 버튼·진행 문구·상태 칸만 바꿔 끼움 (상단 이미지와 나머지는 그대로 → 깜박임 없음) */
function patchDetail() {
  const g = byId(S.view);
  if (!g || S._shown !== S.view) return render();
  S._enter = false;
  const tpl = document.createElement("div");
  tpl.innerHTML = renderDetail(g);
  for (const sel of [".actionbar", ".act-note", ".facts"]) {
    const cur = $("#main " + sel), next = tpl.querySelector(sel);
    if (!cur || !next) return render();
    if (cur.innerHTML === next.innerHTML) continue;
    if (sel === ".actionbar") {
      const cb = cur.querySelector(".primary"), nb = next.querySelector(".primary");
      const cbar = cb?.querySelector(".bar"), nbar = nb?.querySelector(".bar");
      if (cbar && nbar && cb.className === nb.className) {
        cbar.style.cssText = nbar.style.cssText;
        cb.querySelector("span").innerHTML = nb.querySelector("span").innerHTML;
        // 나머지 버튼(다시 확인·복구 등)이 바뀐 경우에만 교체
        const rest = el => [...el.children].slice(1).map(x => x.outerHTML).join("");
        if (rest(cur) !== rest(next)) {
          if (cur.children.length === next.children.length) [...cur.children].slice(1).forEach((x, i) => x.outerHTML = next.children[i + 1].outerHTML);
          else cur.innerHTML = next.innerHTML;
        }

    morph(cur, next);
  }
}
/* 자식 단위로 비교해 바뀐 노드만 교체 (점멸 점 같은 애니메이션이 다시 시작되지 않게) */
function morph(cur, next) {
  if (cur.childNodes.length !== next.childNodes.length) { cur.innerHTML = next.innerHTML; return; }
  [...cur.childNodes].forEach((c, i) => {
    const n = next.childNodes[i];
    if (c.nodeType !== n.nodeType || (c.nodeType === 1 && c.tagName !== n.tagName)) { c.replaceWith(n.cloneNode(true)); return; }
    if (c.nodeType === 3) { if (c.textContent !== n.textContent) c.textContent = n.textContent; return; }
    if (c.outerHTML === n.outerHTML) return;
    const attrs = el => [...el.attributes].map(x => x.name + '=' + x.value).join('|');
    if (attrs(c) !== attrs(n)) { c.replaceWith(n.cloneNode(true)); return; }   // disabled·onclick 등 속성이 바뀌면 통째로
    if (c.children.length === 0 && n.children.length === 0) { c.textContent = n.textContent; return; }
    morph(c, n);
  });
}

on("install-progress", d => { if (S.busy && S.busy.id === d.id) { const phase = S.busy.phase; Object.assign(S.busy, d); if (busyHere(byId(S.view) || {})) patchDetail(); if (phase !== d.phase) renderSide(); } });

async function install(id) {
  const g = byId(id);
  if (!g || S.busy) return;
  if (g.mode === "engine") { if (S.view !== id) go(id); return; }
  if (g.mode === "page" || !g.asset) { openUrl(g.releaseUrl); return; }
  S.busy = { id, phase: "download", done: 0, total: g.asset.size || -1 };
  if (S.view !== id) go(id); else render();
  try {
    await host("install.start", { id, repo: g.repo, tag: g.tag, asset: g.asset.name, url: g.asset.url, digest: g.asset.digest, mode: g.asset.mode });
    S.busy = null;
    await refreshStatus();
    render();
    afterInstall(g);
  } catch (e) {
    S.busy = null; render();
    toast(e.message || "설치를 시작하지 못했습니다.", "err");
  }
}

/* ══════════════════════════════════════════════════════════════
   런처 내장 Quest 설치 (별도 설치기 창 없이 런처가 직접 처리)
   ══════════════════════════════════════════════════════════════ */
const qReq = (g, extra = {}) => ({ id: g.id, repo: g.repo, pkgKey: g.pkgKey || g.repo, tag: g.tag, asset: g.asset?.name, url: g.asset?.url, digest: g.asset?.digest, storage: g.install.storage, ...extra });
let _qPoll = null;
async function questCheck(id, serial) {
  const g = byId(id); if (!g || S.qbusy || S.qwifi) return;
  S.q[id] = { ...(S.q[id] || {}), checking: true }; if (S.view === id) render();
  const seq = (S.qseq = S.qseq || {})[id] = (S.qseq[id] || 0) + 1;
  try {
    const st = await host("quest.state", qReq(g, serial ? { serial } : {}));
    if (S.qseq[id] !== seq || S.qwifi || S.qbusy) return;
    if (st && !st.busy) S.q[id] = st; else if (st?.busy) S.q[id] = { ...(S.q[id] || {}), checking: false };
  } catch (e) { if (S.qseq[id] !== seq) return; S.q[id] = { current: "상태 확인 필요", tag: "확인 필요", tone: "warning", message: e.message }; }
  delete S.qprog[id];
  if (S.view === id) render();
  // 연결 전 단계에서는 자동으로 다시 확인 (기기 파일 검사 없이 가벼움)
  clearTimeout(_qPoll);
  const t = S.q[id]?.tag;
  if (["연결 필요", "인증 필요", "준비 필요", "선택 필요"].includes(t)) _qPoll = setTimeout(() => { if (S.view === id && !S.qbusy) questCheck(id); }, 4000);
}
on("quest-progress", d => { S.qprog[d.id] = d; if (S.view === d.id) patchDetail(); });

async function questRun(id, action, terms = false) {
  const g = byId(id); if (!g || S.qbusy) return;
  const q = S.q[id] || {};
  if (q.needsTerms && !terms) return showTerms(id, action);
  clearTimeout(_qPoll);
  S.qbusy = { id, action }; S.qprog[id] = { message: action === "install" ? "설치를 준비합니다…" : "원본 복구를 준비합니다…" }; render();
  try {
    S.qseq = S.qseq || {}; S.qseq[id] = (S.qseq[id] || 0) + 1;
    const st = await host("quest.run", qReq(g, { action, termsAccepted: terms, serial: q.serial, deviceId: q.deviceId || null }));
    S.q[id] = st || {};
  } catch (e) { S.q[id] = { current: "상태 확인 필요", tag: "확인 필요", tone: "warning", message: e.message, failed: true }; }
  S.qbusy = null; delete S.qprog[id];
  await refreshStatus(); render();
  const st = S.q[id];
  if (st.success && action === "install") st.verifiedOnly ? toast(st.message, "ok") : afterInstall(g, true);
  else if (st.success) toast(action === "cleanup" ? st.message : "원본 복구 완료 · 세이브 진행 상황은 유지됩니다.", "ok");
  else if (st.failed) toast(st.message || "작업을 마치지 못했습니다.", "err");
  else if (st.needsTerms) showTerms(id, action);
}

// ── 무선 연결 (처음 한 번 USB로 켜고, 이후 Wi-Fi로 설치) ──
async function questWifi(id, action, address) {
  const q = S.q[id] || {};
  if (S.qbusy || S.qwifi) return;
  clearTimeout(_qPoll);
  S.qseq = S.qseq || {}; S.qseq[id] = (S.qseq[id] || 0) + 1;
  S.qwifi = { id, action }; S.qprog[id] = { message: { enable: "무선 연결을 켜는 중… (10초 정도 걸려요)", connect: "무선으로 연결하는 중…", disconnect: "무선 연결을 끊는 중…", forget: "무선 연결을 지우는 중…" }[action] }; render();
  let ok = false;
  try {
    const r = await host("quest.wifi", { action, serial: q.serial, address: address || (action === "disconnect" || action === "forget" ? (q.wireless ? q.serial : q.wifiSaved) : null) });
    ok = true;
    if (action === "enable") showWifiDone(id, r.address);
    else toast(r.message, "ok");
  } catch (e) { toast(e.message || "무선 연결에 실패했습니다.", "err"); }
  S.qwifi = null; delete S.qprog[id];
  await engineCheck(byId(id))(id);

/* ══════════════════════════════════════════════════════════════
   런처 내장 PC VR 설치 (게임 폴더가 Program Files 아래면 Windows 권한 확인만 한 번)
   ══════════════════════════════════════════════════════════════ */
const isPcEngine = g => g.mode === "engine" && /^pc-/.test(g.install?.engine || "");
const isFovEngine = g => g?.mode === "engine" && g.install?.engine === "quest-fovlab";
const engineCheck = g => isPcEngine(g) ? pcCheck : isFovEngine(g) ? fovCheck : questCheck;

/* ── Meta VR Glasses FoV Tester: 앱 설치·업데이트 / 다른 게임 적용 / 앱 실행 ── */
const fReq = (g, extra = {}) => ({ id: g.id, repo: g.repo, tag: g.tag, asset: g.asset?.name, url: g.asset?.url, digest: g.asset?.digest, ...extra });
async function fovCheck(id, serial) {
  const g = byId(id); if (!g || S.qbusy || S.qwifi) return;
  S.q[id] = { ...(S.q[id] || {}), checking: true }; if (S.view === id) render();
  const seq = (S.qseq = S.qseq || {})[id] = (S.qseq[id] || 0) + 1;
  try {
    const st = await host("quest.fov.state", fReq(g, serial ? { serial } : {}));
    if (S.qseq[id] !== seq || S.qwifi || S.qbusy) return;
    if (st && !st.busy) S.q[id] = st; else if (st?.busy) S.q[id] = { ...(S.q[id] || {}), checking: false };
  } catch (e) { if (S.qseq[id] !== seq) return; S.q[id] = { current: "상태 확인 필요", tag: "확인 필요", tone: "warning", message: e.message }; }
  delete S.qprog[id];

    <div class="mfoot"><button class="mini acc" style="height:36px;padding:0 16px" onclick="hideModal()">확인</button></div>`, true);

/* 오픈소스 고지: 실행 파일 안에 함께 들어 있는 licenses 폴더의 원문을 보여 줌 */
const NOTICE_FILES = [
  ["THIRD_PARTY_NOTICES.txt", "제3자 고지 (요약)"], ["ZECOLE-Launcher-LICENSE.txt", "ZECOLE 런처 (MIT)"],
  ["WebView2-LICENSE.txt", "WebView2 SDK"], ["WebView2-NOTICE.txt", "WebView2 고지"],
  ["SharpZipLib-LICENSE.txt", "SharpZipLib"], ["zlib-LICENSE.txt", "zlib"], ["bsdiff-LICENSE.txt", "bsdiff"], ["Fonts-OFL.txt", "한글패치 글꼴 (OFL)"],
];
async function showNotices(i = 0) {
  let text;
  try { text = await (await fetch("licenses/" + NOTICE_FILES[i][0], { cache: "no-store" })).text(); }
  catch { text = "고지 파일을 읽지 못했습니다."; }
  showModal(`<h2>오픈소스 고지</h2>
    <div class="seg" style="flex-wrap:wrap;margin:0 0 10px">${NOTICE_FILES.map((f, k) => `<button class="${k === i ? "on" : ""}" onclick="showNotices(${k})">${esc(f[1])}</button>`).join("")}</div>
    <pre style="max-height:46vh;overflow:auto;white-space:pre-wrap;font-size:11.5px;line-height:1.55;background:var(--surface-2);border-radius:8px;padding:12px;margin:0">${esc(text)}</pre>
    <div class="mfoot"><button class="ghost-btn" onclick="hideModal()">닫기</button></div>`);
}

function showDonate() {
  const d = C.links.donate || {};
  showModal(`<h2>한글패치 제작 후원</h2>
    <p>모든 한글패치는 무료입니다. 후원은 번역 검수와 새 게임 작업 시간에 그대로 쓰입니다. 금액과 상관없이 큰 힘이 됩니다.</p>
    ${d.membership ? `<button class="dn" onclick="openUrl('${esc(d.membership)}')"><span class="dn-ic" style="background:#3a1715;color:var(--yt)">▶</span><span><b>유튜브 채널 멤버십</b><span>매월 정기 후원 · 멤버 전용 혜택</span></span><span class="arr">→</span></button>` : ""}
    ${/* 슈퍼 땡스: 결제 창으로 바로 가는 링크가 없어 영상으로 안내. links.donate.superThanks 에 영상 주소를 넣으면 버튼이 됨 */ ""}
    ${d.superThanks
      ? `<button class="dn" onclick="openUrl(C.links.donate.superThanks)"><span class="dn-ic" style="background:#3a1715;color:var(--yt)">♥</span><span><b>슈퍼 땡스</b><span>영상 아래 ‘Thanks(감사)’ 버튼으로 한 번씩 후원</span></span><span class="arr">→</span></button>`
      : `<div class="dn" style="cursor:default"><span class="dn-ic" style="background:#3a1715;color:var(--yt)">♥</span><span><b>슈퍼 땡스</b><span>제콜 유튜브 영상 아래 ‘Thanks(감사)’ 버튼으로 한 번씩 후원할 수 있어요.</span></span></div>`}
    <div class="mfoot"><button class="ghost-btn" onclick="hideModal()">닫기</button></div>`);
}

async function closeApp() {
  if (S.busy || S.qbusy) { toast("설치가 끝난 뒤 닫을 수 있어요.", "err"); return; }
  await host("win.close");
}

/* 시작 게임 안내: 게임 화면으로 바로 가지 않고 홈에 머물며 안내 카드·왼쪽 강조로 보여 줌 */
function openHint(hint) {
  if (!hint) return;
  const h = norm(hint);
  const g = ITEMS.find(x => h === norm(x.id) || h === norm(x.repo) || h === norm(x.name))
    || ITEMS.find(x => [x.id, x.name, x.repo].some(k => { const n = norm(k); return n.length >= 4 && (h.includes(n) || n.includes(h)); }));
  if (!g) return;
  S.hint = g.id;
  if (S.busy || S.qbusy) render();   // 설치 중이면 보던 화면을 유지하고 강조만 표시
  else go("home", true);
}

async function checkLauncherUpdate() {
  const r = await getJson(`https://api.github.com/repos/${C.github}/${C.launcherRepo}/releases/latest`, 1800);
  const rel = r.data; if (!rel || !rel.tag_name) return;
  const v = cleanV(rel.tag_name);
  if (cmpV(v, S.info.version || "0") <= 0) return;
  const a = (rel.assets || []).find(x => /^ZECOLE_Launcher.*\.exe$/i.test(x.name));
  if (a) { S.update = { version: v, url: a.browser_download_url, digest: a.digest }; renderTitle(); }
}
async function applyUpdate() {
  if (S.busy) return toast("설치가 끝난 뒤 업데이트할 수 있어요.", "err");
  try { await host("update.apply", { url: S.update.url, digest: S.update.digest }); }
  catch (e) { toast(e.message, "err"); renderTitle(); }
}

/* 제목 줄 끌어서 창 이동 */
$("#titlebar").addEventListener("mousedown", e => { if (e.button === 0 && !e.target.closest("button")) host("win.drag"); });
addEventListener("keydown", e => { if (e.key === "Escape") { if ($("#scrim").classList.contains("on")) hideModal(); else if (S.view !== "home") go("home"); } });

/* ══════════════════════════════════════════════════════════════
   시작
   ══════════════════════════════════════════════════════════════ */
(async function boot() {
  S.info = await host("app.info") || {};
  renderTitle();
  const steamP = host("steam.apps").then(r => STEAM = r || {}).catch(() => { });
  try { await loadCatalog(); } catch (e) { console.error(e); S.sync = "offline"; }
  await Promise.all([steamP, refreshStatus()]);
  render();
  if (S.info.startHint && !S.hintDone) { S.hintDone = true; openHint(S.info.startHint); }
  host("youtube.feed", { channelId: C.youtube.channelId }).then(v => { VIDEOS = v || []; render(); }).catch(() => { });
  loadStoreNew();
  checkLauncherUpdate();
  setInterval(async () => { if (!S.busy) { await refreshStatus(); render(); } }, 60000);
})();
</script>
</body>
